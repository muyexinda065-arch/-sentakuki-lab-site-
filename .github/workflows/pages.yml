name: Publish washing machine LAB site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read assigned Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 prepare_pages.py --base-url "$PAGE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
